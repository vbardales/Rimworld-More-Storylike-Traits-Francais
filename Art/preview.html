<!doctype html><html lang="en"><meta charset="utf-8"><title>More Storylike Traits - Français</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body,.stage{width:896px;height:504px;overflow:hidden}
.stage{position:relative;font-family:"Segoe UI",system-ui,sans-serif}
.shot{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.veil{position:absolute;inset:0;background:radial-gradient(ellipse 85% 95% at 0% 100%,{{veil}}F0 0%,{{veil}}D9 42%,{{veil}}00 85%)}
.text{position:absolute;left:50px;bottom:44px;color:{{inkPrimary}};text-shadow:0 3px 10px rgba(0,0,0,.75)}
h1{font-size:46px;font-weight:600;line-height:1.1;letter-spacing:0}
h1 span{font-size:.65em;color:{{inkSecondary}}}
.tag{margin-top:8px;font-size:24px;font-weight:400;line-height:1.1;letter-spacing:.2px;color:{{inkSecondary}}}
.rule{width:58px;height:3px;background:{{accent}};margin:20px 0 16px}
.summary{width:430px;font-size:21px;font-weight:400;line-height:1.45}
.badge{position:absolute;right:0;top:0;width:80px;height:80px;background:{{accent}};clip-path:polygon(0 0,100% 0,100% 100%)}
.version{position:absolute;left:869px;top:27px;transform:translate(-50%,-50%) rotate(45deg);font-size:26px;font-weight:700;line-height:1;color:{{badgeInk}}}
</style>
<div class="stage"><img class="shot" src="{{source}}" alt="Colony workshop"><div class="veil"></div>
<div class="text"><h1>More Storylike<br>Traits <span>Français</span></h1><p class="tag">(unofficial)</p><div class="rule"></div><p class="summary">French text for the 53 traits of HYP’s More Storylike Traits.</p></div>
<div class="badge"></div><div class="version">{{version}}</div></div></html>
